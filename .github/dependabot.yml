# Dependabot moves the pinned action SHAs and the pinned gate tools forward through reviewed PRs.
# Pack: github-actions, rule gha-dependabot-pins.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /ci-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /ci-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
