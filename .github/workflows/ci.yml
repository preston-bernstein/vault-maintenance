name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: preston-bernstein/ci-workflows/.github/workflows/node.yml@v1
    with:
      node-versions: '["22"]'
      lint: npm run lint
      format-check: npm run format:check
      test: npm run test
      build: npm run build

  workflows:
    uses: preston-bernstein/ci-workflows/.github/workflows/actions-lint.yml@v1
